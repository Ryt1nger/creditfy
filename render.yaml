# Blueprint для постоянной БД. Не применяет изменения к существующим сервисам автоматически.
databases:
  - name: creditfy-db
    plan: free
    databaseName: creditfy
    user: creditfy
services:
  - type: web
    name: creditfy-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: creditfy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_ACCESS_ENABLED
        value: "1"
      - key: LLM_ENABLED
        value: "0"
      - key: CORS_ORIGINS
        value: https://creditfy-web.onrender.com
  - type: web
    name: creditfy-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_MODE
        value: live
      - key: VITE_API_BASE
        value: https://creditfy-api.onrender.com
