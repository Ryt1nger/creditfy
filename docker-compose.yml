# Запуск: docker compose up --build   →   http://localhost:8080
# С локальной моделью (опционально): LLM_ENABLED=1 docker compose --profile llm up --build
#   затем: docker compose exec ollama ollama pull deepseek-r1:1.5b
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: creditfy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditfy-demo-password}
      POSTGRES_DB: creditfy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditfy"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://creditfy:${POSTGRES_PASSWORD:-creditfy-demo-password}@db:5432/creditfy
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-0123456789}
      PIPELINE_STEP_DELAY: ${PIPELINE_STEP_DELAY:-0.9}
      LLM_ENABLED: ${LLM_ENABLED:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-r1:1.5b}
      LLM_MAX_CALLS: ${LLM_MAX_CALLS:-3}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-8}
      SEED_DEMO: "1"
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:8080
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_MODE: live }
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }
  # Локальная модель с открытыми весами. Не входит в проверяемый путь: поднимается только с --profile llm.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [llm]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
volumes:
  pgdata:
  uploads:
  ollama:
